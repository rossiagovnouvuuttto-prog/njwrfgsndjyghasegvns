name: Build PvPHelper

on:
  push:
    branches:
      - build-pvphelper-1.16.5
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Build
        run: gradle clean build --stacktrace

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: PvPHelper-1.16.5-Fabric-v1.1.0
          path: build/libs/*.jar
          if-no-files-found: error
